<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>The Third Space | ទំនាក់ទំនង</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;600;700&family=Playfair+Display:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same CSS as contact.html - copy exactly */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI','Poppins','Khmer OS','Noto Sans Khmer',system-ui,sans-serif; background:#fef7e8; color:#2c2418; }
        .navbar { position:sticky; top:0; z-index:100; background:rgba(255,244,230,0.96); backdrop-filter:blur(10px); border-bottom:2px solid #e6d5b8; padding:0.8rem 2rem; }
        .nav-container { max-width:1400px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .logo { display:flex; align-items:center; gap:8px; text-decoration:none; font-size:1.3rem; font-weight:700; color:#5a3e2b; font-family:'Playfair Display',serif; }
        .hamburger { display:none; font-size:1.8rem; background:none; border:none; color:#5a3e2b; cursor:pointer; padding:0.5rem; }
        .nav-links { display:flex; flex-wrap:wrap; align-items:center; gap:2rem; transition:all 0.3s ease; margin:0 auto; }
        .nav-link { text-decoration:none; color:#5a3e2b; font-weight:600; font-size:1.2rem; padding:0.5rem 1.2rem; border-radius:40px; transition:all 0.25s ease; }
        .nav-link:hover { background:#c7a66b; color:white; transform:translateY(-2px); box-shadow:0 5px 12px rgba(0,0,0,0.1); }
        .flag-btns { display:flex; gap:12px; }
        .flag { width:42px; border-radius:30px; transition:0.2s; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
        .flag:hover { transform:scale(1.08); }
        @media (max-width:768px) {
            .hamburger { display:block; }
            .nav-links { display:none; flex-direction:column; width:100%; background:rgba(255,244,230,0.98); padding:1rem 0; border-radius:1rem; margin-top:0.5rem; margin-left:0; margin-right:0; }
            .nav-links.show { display:flex; }
            .nav-container { flex-wrap:wrap; }
            .nav-links .flag-btns { justify-content:center; margin-top:0.5rem; }
        }
        .wrapper { max-width:1400px; margin:0 auto; padding:30px 40px; }
        .contact-card { background:#e8d9c4; border-radius:48px; padding:2.5rem; margin:50px 0 30px; text-align:center; transition:all 0.3s; }
        .contact-card:hover { background:#e2cfb0; transform:scale(0.99); }
        .contact-card h2 { font-size:2rem; margin-bottom:1.2rem; color:#553a1f; }
        .contact-info p { font-size:1.2rem; margin:12px 0; font-weight:500; }
        .contact-info span { background:white; padding:0.3rem 1.2rem; border-radius:50px; display:inline-block; }
        .badge { background:white; padding:0.6rem 1.8rem; border-radius:60px; font-weight:600; margin-top:20px; display:inline-block; transition:0.2s; }
        .badge:hover { background:#aa7c4a; color:white; cursor:pointer; }
        footer { text-align:center; padding:2rem; border-top:2px solid #e6cfad; margin-top:30px; color:#7e5a3b; }
        @media (max-width:900px) { .wrapper { padding:20px; } .contact-card h2 { font-size:1.8rem; } .contact-info p { font-size:1rem; } }
        .cart-float { position:fixed; bottom:28px; right:28px; background:#d97a2b; width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:white; font-size:26px; box-shadow:0 12px 24px rgba(0,0,0,0.2); cursor:pointer; z-index:200; background:linear-gradient(145deg,#c46a2c,#ac5a22); }
        .cart-float:hover { transform:scale(1.08); }
        .cart-count { position:absolute; top:-6px; right:-6px; background:#1f1b16; color:#ffdfb3; font-size:13px; font-weight:bold; width:24px; height:24px; border-radius:30px; display:flex; align-items:center; justify-content:center; }
        .cart-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background-color:rgba(0,0,0,0.6); backdrop-filter:blur(8px); z-index:1000; align-items:center; justify-content:center; }
        .cart-modal-content { background:#fffef7; max-width:550px; width:90%; max-height:85vh; border-radius:2rem; padding:1.5rem 1.8rem; overflow-y:auto; }
        .cart-items-list { max-height:320px; overflow-y:auto; margin:1rem 0; }
        .cart-item { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eedbc8; padding:12px 0; flex-wrap:wrap; gap:8px; }
        .cart-item-controls button { background:#f1e5d8; border:none; border-radius:30px; width:30px; height:30px; font-weight:bold; cursor:pointer; }
        .cart-total { font-weight:800; font-size:1.3rem; text-align:right; border-top:2px dashed #e7cfb9; padding-top:1rem; }
        .booking-form input, .booking-form textarea { width:100%; padding:12px 14px; margin:8px 0; border-radius:2rem; border:1px solid #e2cfbc; background:#fffbf5; font-family:inherit; }
        .place-order-btn { background:#2c2418; color:white; border:none; padding:14px; width:100%; border-radius:40px; font-weight:bold; margin-top:20px; cursor:pointer; font-size:1rem; }
        .place-order-btn:hover { background:#b45f2b; }
        .close-modal { float:right; background:none; border:none; font-size:28px; cursor:pointer; color:#a57448; }
        .add-cart-btn { background:#5a3e2b; border:none; padding:8px 18px; border-radius:40px; font-weight:600; font-size:0.85rem; color:#fef3e4; cursor:pointer; display:inline-flex; align-items:center; gap:8px; margin:6px 0 12px; }
        .add-cart-btn:hover { background:#b45f2b; transform:scale(0.96); }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="nav-container">
            <a href="index-Kh.html" class="logo">☕ The Third Space</a>
            <button class="hamburger" id="hamburgerBtn">☰</button>
            <div class="nav-links" id="navLinks">
                <a href="index-Kh.html" class="nav-link">ទំព័រដើម</a>
                <a href="cake-kh.html" class="nav-link">នំខេក</a>
                <a href="drink-kh.html" class="nav-link">ភេសជ្ជៈ</a>
                <a href="contact-kh.html" class="nav-link">ទំនាក់ទំនង</a>
                <div class="flag-btns">
                    <a href="index.html"><img src="images/flag/english flag.png" alt="EN" class="flag"
                            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 60 40\'%3E%3Crect width=\'60\' height=\'40\' fill=\'%23ffffff\'/%3E%3Crect width=\'30\' height=\'40\' fill=\'%2300227a\'/%3E%3Crect x=\'30\' width=\'30\' height=\'40\' fill=\'%23cf142b\'/%3E%3C/svg%3E'; this.onerror=null;"></a>
                    <a href="index-Kh.html"><img src="images/flag/khmer flag.png" alt="KH" class="flag"
                            onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 60 40\'%3E%3Crect width=\'60\' height=\'40\' fill=\'%23003264\'/%3E%3Crect y=\'13.3\' width=\'60\' height=\'13.3\' fill=\'%23e8000e\'/%3E%3C/svg%3E'; this.onerror=null;"></a>
                </div>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="contact-card">
            <h2>📞 ទំនាក់ទំនងមកកាន់យើង</h2>
            <div class="contact-info">
                <p>📱 តេឡេក្រាម: <span>TheThirdSpace_369</span></p>
                <p>📘 ហ្វេសប៊ុក: <span>The Third Space</span></p>
                <p>📸 អ៊ីនស្តាក្រាម: <span>The Third Space</span></p>
                <div class="badge">✉️ បើមានបញ្ហាអ្វី សូមទាក់ទងមកយើងខ្ញុំ ២៤/៧</div>
            </div>
        </div>
    </div>

    <footer>© 2025 ទីធ្លាទីបី — កន្លែងកក់ក្តៅសម្រាប់កាហ្វេ និងនំខេក។ ☕✨</footer>

    <script>
        const hamburger = document.getElementById('hamburgerBtn');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => navLinks.classList.toggle('show'));
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => navLinks.classList.remove('show'));
            });
        }

        (function () {
            let cart = [];
            function parsePrice(priceStr) { let m = priceStr.match(/[\d\.]+/); return m ? parseFloat(m[0]) : 0; }
            function persistCart() { localStorage.setItem('thirdspace_cart', JSON.stringify(cart)); updateCartCount(); }
            function loadCart() { const s = localStorage.getItem('thirdspace_cart'); if (s) { try { cart = JSON.parse(s); if (!Array.isArray(cart)) cart = []; } catch (e) { cart = []; } } else { cart = []; } updateCartCount(); }
            function updateCartCount() { const q = cart.reduce((s, i) => s + i.quantity, 0); const b = document.querySelector('.cart-count'); if (b) b.innerText = q; }
            function findCartIndex(n, p) { return cart.findIndex(i => i.name === n && Math.abs(i.price - p) < 0.01); }
            
            function addToCart(n, p) {
                let idx = findCartIndex(n, p);
                if (idx !== -1) cart[idx].quantity += 1;
                else cart.push({ id: Date.now() + Math.random(), name: n, price: p, quantity: 1 });
                persistCart();
                if (document.getElementById('cartModal')?.style.display === 'flex') renderCartModal();
            }
            
            function removeCartItem(i) { cart.splice(i, 1); persistCart(); renderCartModal(); updateCartCount(); }
            function updateQuantity(i, d) { if (!cart[i]) return; let nq = cart[i].quantity + d; if (nq <= 0) removeCartItem(i); else { cart[i].quantity = nq; persistCart(); renderCartModal(); updateCartCount(); } }
            
            function renderCartModal() {
                const c = document.getElementById('cartItemsContainer');
                const ts = document.getElementById('cartTotalValue');
                if (!c) return;
                if (!cart.length) {
                    c.innerHTML = `<div style="text-align:center;padding:2rem;">កន្ត្រកទទេ</div>`;
                    if (ts) ts.innerText = "0.00";
                    return;
                }
                let html = '', tot = 0;
                cart.forEach((it, idx) => {
                    let itt = it.price * it.quantity;
                    tot += itt;
                    html += `<div class="cart-item"><div><strong>${escapeHtml(it.name)}</strong><br><span style="font-size:12px">$${it.price.toFixed(2)} each</span></div><div class="cart-item-controls"><button class="qty-minus" data-index="${idx}">−</button><span style="width:28px;text-align:center">${it.quantity}</span><button class="qty-plus" data-index="${idx}">+</button><button class="remove-item" data-index="${idx}"><i class="fas fa-trash-alt"></i></button></div><div style="min-width:70px;text-align:right">$${itt.toFixed(2)}</div></div>`;
                });
                c.innerHTML = html;
                if (ts) ts.innerText = tot.toFixed(2);
                document.querySelectorAll('.qty-minus').forEach(b => b.addEventListener('click', (e) => updateQuantity(parseInt(b.dataset.index), -1)));
                document.querySelectorAll('.qty-plus').forEach(b => b.addEventListener('click', (e) => updateQuantity(parseInt(b.dataset.index), 1)));
                document.querySelectorAll('.remove-item').forEach(b => b.addEventListener('click', (e) => removeCartItem(parseInt(b.dataset.index))));
            }
            
            function escapeHtml(s) { return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
            
            function placeOrder() {
                if (cart.length === 0) return;
                const name = document.getElementById('custName')?.value.trim();
                const phone = document.getElementById('custPhone')?.value.trim();
                const notes = document.getElementById('orderNotes')?.value.trim();
                if (!name || !phone) return;
                const orderItems = cart.map(item => ({ name: item.name, price: item.price, quantity: item.quantity }));
                const orderTotal = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const formValues = { name: name, phone: phone, notes: notes };
                const placeBtn = document.getElementById('placeOrderBtn');
                if (placeBtn) placeBtn.disabled = true;
                fetch('https://thethirdspace-3.onrender.com/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_name: name, phone: phone, notes: notes, items: orderItems })
                })
                .then(response => response.json())
                .then(data => {
                    let summaryHtml = `<div style="text-align:center; margin-bottom:15px;"><i class="fas fa-check-circle" style="font-size:48px; color:#2b6e3c;"></i><h3 style="color:#2b6e3c; margin-top:10px;">✅ Order Confirmed!</h3><p style="color:#666; margin-top:5px;">Order #${data.order_id || 'N/A'}</p></div><div style="max-height:300px; overflow-y:auto; margin-bottom:15px;"><table style="width:100%; border-collapse:collapse;"><thead><tr style="border-bottom:2px solid #e6cfad;"><th style="text-align:left; padding:8px;">Item</th><th style="text-align:center; padding:8px;">Qty</th><th style="text-align:right; padding:8px;">Price</th><th style="text-align:right; padding:8px;">Total</th></tr></thead><tbody>`;
                    cart.forEach(item => { const itemTotal = item.price * item.quantity; summaryHtml += `<tr style="border-bottom:1px solid #f0e0ca;"><td style="text-align:left; padding:8px;">${escapeHtml(item.name)}</td><td style="text-align:center; padding:8px;">${item.quantity}</td><td style="text-align:right; padding:8px;">$${item.price.toFixed(2)}</td><td style="text-align:right; padding:8px;">$${itemTotal.toFixed(2)}</td></tr>`; });
                    summaryHtml += `</tbody><tfoot><tr style="border-top:2px solid #e6cfad;"><td colspan="3" style="text-align:right; padding:8px; font-weight:bold;">Total:</td><td style="text-align:right; padding:8px; font-weight:bold; color:#b2703a;">$${orderTotal.toFixed(2)}</td></tr></tfoot></table></div><div style="background:#f9eedf; border-radius:1rem; padding:12px; margin:15px 0;"><p><strong>👤 Customer:</strong> ${escapeHtml(formValues.name)}</p><p><strong>📞 Phone:</strong> ${escapeHtml(formValues.phone)}</p>${formValues.notes ? `<p><strong>📝 Notes:</strong> ${escapeHtml(formValues.notes)}</p>` : ''}</div><div style="text-align:center;"><button id="closeSuccessModal" class="place-order-btn" style="background:#b45f2b;">Continue Shopping</button></div>`;
                    const modalContent = document.querySelector('.cart-modal-content');
                    const originalContent = modalContent.innerHTML;
                    modalContent.innerHTML = summaryHtml;
                    document.getElementById('closeSuccessModal').onclick = () => {
                        modalContent.innerHTML = originalContent;
                        document.getElementById('cartModal').style.display = 'none';
                        const closeBtn = document.getElementById('closeCartModalBtn');
                        if (closeBtn) closeBtn.onclick = () => document.getElementById('cartModal').style.display = 'none';
                        const placeOrderBtn = document.getElementById('placeOrderBtn');
                        if (placeOrderBtn) placeOrderBtn.onclick = placeOrder;
                    };
                    cart = [];
                    persistCart();
                    updateCartCount();
                    const nameField = document.getElementById('custName');
                    const phoneField = document.getElementById('custPhone');
                    const notesField = document.getElementById('orderNotes');
                    if (nameField) nameField.value = '';
                    if (phoneField) phoneField.value = '';
                    if (notesField) notesField.value = '';
                    renderCartModal();
                })
                .catch(error => console.error('Order error:', error))
                .finally(() => { if (placeBtn) placeBtn.disabled = false; });
            }
            
            function buildUI() {
                if (document.getElementById('cartFloatBtn')) return;
                let float = document.createElement('div');
                float.id = 'cartFloatBtn';
                float.className = 'cart-float';
                float.innerHTML = '<i class="fas fa-shopping-bag"></i><span class="cart-count">0</span>';
                document.body.appendChild(float);
                let modal = document.createElement('div');
                modal.id = 'cartModal';
                modal.className = 'cart-modal';
                modal.innerHTML = `<div class="cart-modal-content"><button class="close-modal" id="closeCartModalBtn">&times;</button><h2><i class="fas fa-coffee"></i> Your Order Basket</h2><div id="cartItemsContainer" class="cart-items-list"></div><div class="cart-total">Total: $<span id="cartTotalValue">0.00</span></div><div class="booking-form"><input type="text" id="custName" placeholder="Your full name *"><input type="tel" id="custPhone" placeholder="Phone / Telegram *"><textarea id="orderNotes" rows="2" placeholder="Special requests..."></textarea><button id="placeOrderBtn" class="place-order-btn">Confirm booking</button></div></div>`;
                document.body.appendChild(modal);
                float.onclick = () => { renderCartModal(); modal.style.display = 'flex'; };
                document.getElementById('closeCartModalBtn').onclick = () => modal.style.display = 'none';
                window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
                document.getElementById('placeOrderBtn').onclick = placeOrder;
            }
            
            function init() { loadCart(); buildUI(); updateCartCount(); }
            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>

</html>
