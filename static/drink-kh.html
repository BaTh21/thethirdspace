<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>The Third Space | ភេសជ្ជៈ</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;600;700&family=Playfair+Display:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Same CSS as cake-kh.html - copy exactly */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Khmer OS', 'Noto Sans Khmer', system-ui, sans-serif;
            background: #fef7e8;
            color: #2c2418;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 244, 230, 0.96);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e6d5b8;
            padding: 0.8rem 2rem;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 700;
            color: #5a3e2b;
            font-family: 'Playfair Display', serif;
        }

        .hamburger {
            display: none;
            font-size: 1.8rem;
            background: none;
            border: none;
            color: #5a3e2b;
            cursor: pointer;
            padding: 0.5rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2rem;
            transition: all 0.3s ease;
            margin: 0 auto;
        }

        .nav-link {
            text-decoration: none;
            color: #5a3e2b;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            transition: all 0.25s ease;
        }

        .nav-link:hover {
            background: #c7a66b;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.1);
        }

        .nav-link.active {
            background: #c7a66b;
            color: white;
            pointer-events: none;
        }

        .flag-btns {
            display: flex;
            gap: 12px;
        }

        .flag {
            width: 42px;
            border-radius: 30px;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .flag:hover {
            transform: scale(1.08);
        }

        @media (max-width:768px) {
            .hamburger {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background: rgba(255, 244, 230, 0.98);
                padding: 1rem 0;
                border-radius: 1rem;
                margin-top: 0.5rem;
                margin-left: 0;
                margin-right: 0;
            }

            .nav-links.show {
                display: flex;
            }

            .nav-container {
                flex-wrap: wrap;
            }

            .nav-links .flag-btns {
                justify-content: center;
                margin-top: 0.5rem;
            }
        }

        .wrapper {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 40px;
        }

        .page-title {
            text-align: center;
            font-size: 3rem;
            margin: 30px 0 40px;
            color: #6b3e1a;
            position: relative;
        }

        .page-title::after {
            content: '';
            width: 100px;
            height: 4px;
            background: #d4a373;
            display: block;
            margin: 12px auto 0;
            border-radius: 4px;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
            margin: 40px 0;
        }

        .card {
            background: white;
            width: 280px;
            border-radius: 32px;
            text-align: center;
            padding: 1.5rem 1rem;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid #f0e0ca;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-12px);
            background: #fffbf5;
            border-color: #dbb98a;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 28px;
            background: #f0e0ca;
        }

        .card h3 {
            font-size: 1.4rem;
            margin: 15px 0 8px;
            color: #4d2f15;
        }

        .price {
            font-size: 1.7rem;
            font-weight: 800;
            color: #b2703a;
            background: #f9eedf;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            margin-top: 8px;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 2px solid #e6cfad;
            margin-top: 30px;
            color: #7e5a3b;
        }

        @media (max-width:900px) {
            .wrapper {
                padding: 20px;
            }

            .page-title {
                font-size: 2.2rem;
            }

            .card {
                width: 250px;
            }
        }

        @media (max-width:600px) {
            .card {
                width: 100%;
                max-width: 280px;
            }

            .page-title {
                font-size: 1.8rem;
            }
        }

        .add-cart-btn {
            background: #5a3e2b;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #fef3e4;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0 12px;
        }

        .add-cart-btn:hover {
            background: #b45f2b;
            transform: scale(0.96);
        }

        .cart-float {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #d97a2b;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 200;
            background: linear-gradient(145deg, #c46a2c, #ac5a22);
        }

        .cart-float:hover {
            transform: scale(1.08);
        }

        .cart-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #1f1b16;
            color: #ffdfb3;
            font-size: 13px;
            font-weight: bold;
            width: 24px;
            height: 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .cart-modal-content {
            background: #fffef7;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            border-radius: 2rem;
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
        }

        .cart-items-list {
            max-height: 320px;
            overflow-y: auto;
            margin: 1rem 0;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eedbc8;
            padding: 12px 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cart-item-controls button {
            background: #f1e5d8;
            border: none;
            border-radius: 30px;
            width: 30px;
            height: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-total {
            font-weight: 800;
            font-size: 1.3rem;
            text-align: right;
            border-top: 2px dashed #e7cfb9;
            padding-top: 1rem;
        }

        .booking-form input,
        .booking-form textarea {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 2rem;
            border: 1px solid #e2cfbc;
            background: #fffbf5;
            font-family: inherit;
        }

        .place-order-btn {
            background: #2c2418;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 40px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            font-size: 1rem;
        }

        .place-order-btn:hover {
            background: #b45f2b;
        }

        .close-modal {
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #a57448;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="nav-container">
            <a href="index-Kh.html" class="logo">☕ The Third Space</a>
            <button class="hamburger" id="hamburgerBtn">☰</button>
            <div class="nav-links" id="navLinks">
                <a href="index-Kh.html" class="nav-link">ទំព័រដើម</a>
                <a href="cake-kh.html" class="nav-link">នំខេក</a>
                <a href="drink-kh.html" class="nav-link">ភេសជ្ជៈ</a>
                <a href="history-kh.html" class="nav-link">ប្រវត្តិ</a>
                <a href="contact-kh.html" class="nav-link">ទំនាក់ទំនង</a>
                <div class="flag-btns">
                    <a href="drink.html"><img src="images/flag/english flag.png" alt="EN" class="flag"></a>
                    <a href="drink-kh.html"><img src="images/flag/khmer flag.png" alt="KH" class="flag"></a>
                </div>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <h1 class="page-title">🥤 ភេសជ្ជៈពិសេស</h1>
        <div class="grid">
            <div class="card"><img src="images/Drink/1.png" alt="macchiato"
                    onerror="this.src='https://picsum.photos/id/224/280/200'; this.onerror=null;">
                <h3>ការ៉ាមែល ម៉ាគីយ៉ាតូ</h3>
                <div class="price">2.43$</div>
            </div>
            <div class="card"><img src="images/Drink/2.png" alt="latte"
                    onerror="this.src='https://picsum.photos/id/225/280/200'; this.onerror=null;">
                <h3>ឡាតេវ៉ានីឡា</h3>
                <div class="price">2.93$</div>
            </div>
            <div class="card"><img src="images/Drink/4.png" alt="matcha"
                    onerror="this.src='https://picsum.photos/id/226/280/200'; this.onerror=null;">
                <h3>ម៉ាឆា ឡាតេ</h3>
                <div class="price">3.50$</div>
            </div>
            <div class="card"><img src="images/Drink/3.png" alt="cold brew"
                    onerror="this.src='https://picsum.photos/id/227/280/200'; this.onerror=null;">
                <h3>ខូដប្រ៊ូ</h3>
                <div class="price">1.45$</div>
            </div>
            <div class="card"><img src="images/Drink/5.png" alt="mocha"
                    onerror="this.src='https://picsum.photos/id/228/280/200'; this.onerror=null;">
                <h3>ម៉ូកា</h3>
                <div class="price">2.43$</div>
            </div>
            <div class="card"><img src="images/Drink/6.png" alt="affogato"
                    onerror="this.src='https://picsum.photos/id/229/280/200'; this.onerror=null;">
                <h3>អាហ្វូហ្គាតូ</h3>
                <div class="price">3.00$</div>
            </div>
        </div>
    </div>

    <footer>© BaTh-2026 The Third Space — កន្លែងកក់ក្តៅសម្រាប់កាហ្វេ និងនំខេក។ ☕✨</footer>

    <script>
        // Same script as cake-kh.html - copy exactly
        const hamburger = document.getElementById('hamburgerBtn');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => navLinks.classList.toggle('show'));
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', () => navLinks.classList.remove('show'));
            });
        }
        (function setActiveNavLink() {
            const currentFile = window.location.pathname.split('/').pop() || 'index.html';
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentFile) {
                    link.classList.add('active');
                }
            });
        })();
        (function () {
            let cart = [];
            function parsePrice(priceStr) { let m = priceStr.match(/[\d\.]+/); return m ? parseFloat(m[0]) : 0; }
            function persistCart() { localStorage.setItem('thirdspace_cart', JSON.stringify(cart)); updateCartCount(); }
            function loadCart() { const s = localStorage.getItem('thirdspace_cart'); if (s) { try { cart = JSON.parse(s); if (!Array.isArray(cart)) cart = []; } catch (e) { cart = []; } } else { cart = []; } updateCartCount(); }
            function updateCartCount() { const q = cart.reduce((s, i) => s + i.quantity, 0); const b = document.querySelector('.cart-count'); if (b) b.innerText = q; }
            function findCartIndex(n, p) { return cart.findIndex(i => i.name === n && Math.abs(i.price - p) < 0.01); }

            function addToCart(n, p) {
                let idx = findCartIndex(n, p);
                if (idx !== -1) cart[idx].quantity += 1;
                else cart.push({ id: Date.now() + Math.random(), name: n, price: p, quantity: 1 });
                persistCart();
                if (document.getElementById('cartModal')?.style.display === 'flex') renderCartModal();
            }

            function removeCartItem(i) { cart.splice(i, 1); persistCart(); renderCartModal(); updateCartCount(); }
            function updateQuantity(i, d) { if (!cart[i]) return; let nq = cart[i].quantity + d; if (nq <= 0) removeCartItem(i); else { cart[i].quantity = nq; persistCart(); renderCartModal(); updateCartCount(); } }

            function renderCartModal() {
                const c = document.getElementById('cartItemsContainer');
                const ts = document.getElementById('cartTotalValue');
                if (!c) return;
                if (!cart.length) {
                    c.innerHTML = `<div style="text-align:center;padding:2rem;">កន្ត្រកទទេ</div>`;
                    if (ts) ts.innerText = "0.00";
                    return;
                }
                let html = '', tot = 0;
                cart.forEach((it, idx) => {
                    let itt = it.price * it.quantity;
                    tot += itt;
                    html += `<div class="cart-item"><div><strong>${escapeHtml(it.name)}</strong><br><span style="font-size:12px">$${it.price.toFixed(2)} each</span></div><div class="cart-item-controls"><button class="qty-minus" data-index="${idx}">−</button><span style="width:28px;text-align:center">${it.quantity}</span><button class="qty-plus" data-index="${idx}">+</button><button class="remove-item" data-index="${idx}"><i class="fas fa-trash-alt"></i></button></div><div style="min-width:70px;text-align:right">$${itt.toFixed(2)}</div></div>`;
                });
                c.innerHTML = html;
                if (ts) ts.innerText = tot.toFixed(2);
                document.querySelectorAll('.qty-minus').forEach(b => b.addEventListener('click', (e) => updateQuantity(parseInt(b.dataset.index), -1)));
                document.querySelectorAll('.qty-plus').forEach(b => b.addEventListener('click', (e) => updateQuantity(parseInt(b.dataset.index), 1)));
                document.querySelectorAll('.remove-item').forEach(b => b.addEventListener('click', (e) => removeCartItem(parseInt(b.dataset.index))));
            }

            function escapeHtml(s) { return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

            function placeOrder() {
                if (cart.length === 0) return;
                const name = document.getElementById('custName')?.value.trim();
                const phone = document.getElementById('custPhone')?.value.trim();
                const notes = document.getElementById('orderNotes')?.value.trim();
                if (!name || !phone) return;
                const orderItems = cart.map(item => ({ name: item.name, price: item.price, quantity: item.quantity }));
                const orderTotal = orderItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const formValues = { name: name, phone: phone, notes: notes };
                const placeBtn = document.getElementById('placeOrderBtn');
                if (placeBtn) placeBtn.disabled = true;
                fetch('https://thethirdspace-3.onrender.com/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_name: name, phone: phone, notes: notes, items: orderItems })
                })
                    .then(response => response.json())
                    .then(data => {
                        let summaryHtml = `
    <div style="text-align:center; margin-bottom:15px;">
        <i class="fas fa-check-circle" style="font-size:48px; color:#2b6e3c;"></i>
        <h3 style="color:#2b6e3c; margin-top:10px;">✅ Order Confirmed!</h3>
        <p style="color:#666; margin-top:5px;">Order #${data.order_id || 'N/A'}</p>
    </div>
    <div style="max-height:300px; overflow-y:auto; margin-bottom:15px;">
        <table style="width:100%; border-collapse:collapse;">
            <thead><tr style="border-bottom:2px solid #e6cfad;">
                <th style="text-align:left; padding:8px;">Item</th>
                <th style="text-align:center; padding:8px;">Qty</th>
                <th style="text-align:right; padding:8px;">Price</th>
                <th style="text-align:right; padding:8px;">Total</th>
             </tr></thead>
            <tbody>`;
                        cart.forEach(item => {
                            const itemTotal = item.price * item.quantity;
                            summaryHtml += `<tr style="border-bottom:1px solid #f0e0ca;">
        <td style="text-align:left; padding:8px;">${escapeHtml(item.name)}</td>
        <td style="text-align:center; padding:8px;">${item.quantity}</td>
        <td style="text-align:right; padding:8px;">$${item.price.toFixed(2)}</td>
        <td style="text-align:right; padding:8px;">$${itemTotal.toFixed(2)}</td>
    </tr>`;
                        });
                        summaryHtml += `
            </tbody>
            <tfoot><tr style="border-top:2px solid #e6cfad;">
                <td colspan="3" style="text-align:right; padding:8px; font-weight:bold;">Total:</td>
                <td style="text-align:right; padding:8px; font-weight:bold; color:#b2703a;">$${orderTotal.toFixed(2)}</td>
            </tr></tfoot>
        </table>
    </div>
    <div style="background:#f9eedf; border-radius:1rem; padding:12px; margin:15px 0;">
        <p><strong>👤 Customer:</strong> ${escapeHtml(formValues.name)}</p>
        <p><strong>📞 Phone:</strong> ${escapeHtml(formValues.phone)}</p>
        ${formValues.notes ? `<p><strong>📝 Notes:</strong> ${escapeHtml(formValues.notes)}</p>` : ''}
    </div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
        <button id="closeSuccessModal" class="place-order-btn" style="background:#b45f2b; flex:1;">Continue Shopping</button>
        <button id="viewHistoryBtn" class="place-order-btn" style="background:#5a3e2b; flex:1;"><i class="fas fa-history"></i> View Order History</button>
    </div>
`;
                        cart.forEach(item => { const itemTotal = item.price * item.quantity; summaryHtml += `<tr style="border-bottom:1px solid #f0e0ca;"><td style="text-align:left; padding:8px;">${escapeHtml(item.name)}</td><td style="text-align:center; padding:8px;">${item.quantity}</td><td style="text-align:right; padding:8px;">$${item.price.toFixed(2)}</td><td style="text-align:right; padding:8px;">$${itemTotal.toFixed(2)}</td></tr>`; });
                        summaryHtml += `</tbody><tfoot><tr style="border-top:2px solid #e6cfad;"><td colspan="3" style="text-align:right; padding:8px; font-weight:bold;">Total:</td><td style="text-align:right; padding:8px; font-weight:bold; color:#b2703a;">$${orderTotal.toFixed(2)}</td></tr></tfoot></table></div><div style="background:#f9eedf; border-radius:1rem; padding:12px; margin:15px 0;"><p><strong>👤 Customer:</strong> ${escapeHtml(formValues.name)}</p><p><strong>📞 Phone:</strong> ${escapeHtml(formValues.phone)}</p>${formValues.notes ? `<p><strong>📝 Notes:</strong> ${escapeHtml(formValues.notes)}</p>` : ''}</div><div style="text-align:center;"><button id="closeSuccessModal" class="place-order-btn" style="background:#b45f2b;">Continue Shopping</button></div>`;
                        const modalContent = document.querySelector('.cart-modal-content');
                        const originalContent = modalContent.innerHTML;
                        modalContent.innerHTML = summaryHtml;
                        document.getElementById('closeSuccessModal').onclick = () => {
                            modalContent.innerHTML = originalContent;
                            document.getElementById('cartModal').style.display = 'none';
                            const closeBtn = document.getElementById('closeCartModalBtn');
                            if (closeBtn) closeBtn.onclick = () => document.getElementById('cartModal').style.display = 'none';
                            const placeOrderBtn = document.getElementById('placeOrderBtn');
                            if (placeOrderBtn) placeOrderBtn.onclick = placeOrder;
                        };

                        document.getElementById('viewHistoryBtn').onclick = () => {
                            window.location.href = `history.html?phone=${encodeURIComponent(formValues.phone)}`;
                        };
                        cart = [];
                        persistCart();
                        updateCartCount();
                        const nameField = document.getElementById('custName');
                        const phoneField = document.getElementById('custPhone');
                        const notesField = document.getElementById('orderNotes');
                        if (nameField) nameField.value = '';
                        if (phoneField) phoneField.value = '';
                        if (notesField) notesField.value = '';
                        renderCartModal();
                    })
                    .catch(error => console.error('Order error:', error))
                    .finally(() => { if (placeBtn) placeBtn.disabled = false; });
            }

            function injectAddButtons() {
                document.querySelectorAll('.card').forEach(card => {
                    if (card.querySelector('.add-cart-btn')) return;
                    let title = card.querySelector('h3')?.innerText.trim();
                    let priceElem = card.querySelector('.price');
                    if (!title || !priceElem) return;
                    let priceVal = parsePrice(priceElem.innerText);
                    let btn = document.createElement('button');
                    btn.className = 'add-cart-btn';
                    btn.innerHTML = '<i class="fas fa-shopping-cart"></i> Book now / Add';
                    btn.addEventListener('click', (e) => { e.stopPropagation(); addToCart(title, priceVal); });
                    priceElem.insertAdjacentElement('afterend', btn);
                });
            }

            function buildUI() {
                if (document.getElementById('cartFloatBtn')) return;
                let float = document.createElement('div');
                float.id = 'cartFloatBtn';
                float.className = 'cart-float';
                float.innerHTML = '<i class="fas fa-shopping-bag"></i><span class="cart-count">0</span>';
                document.body.appendChild(float);
                let modal = document.createElement('div');
                modal.id = 'cartModal';
                modal.className = 'cart-modal';
                modal.innerHTML = `<div class="cart-modal-content"><button class="close-modal" id="closeCartModalBtn">&times;</button><h2><i class="fas fa-coffee"></i> Your Order Basket</h2><div id="cartItemsContainer" class="cart-items-list"></div><div class="cart-total">Total: $<span id="cartTotalValue">0.00</span></div><div class="booking-form"><input type="text" id="custName" placeholder="Your full name *"><input type="tel" id="custPhone" placeholder="Phone / Telegram *"><textarea id="orderNotes" rows="2" placeholder="Special requests..."></textarea><button id="placeOrderBtn" class="place-order-btn">Confirm booking</button></div></div>`;
                document.body.appendChild(modal);
                float.onclick = () => { renderCartModal(); modal.style.display = 'flex'; };
                document.getElementById('closeCartModalBtn').onclick = () => modal.style.display = 'none';
                window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
                document.getElementById('placeOrderBtn').onclick = placeOrder;
            }

            function init() { loadCart(); buildUI(); injectAddButtons(); updateCartCount(); new MutationObserver(() => injectAddButtons()).observe(document.body, { childList: true, subtree: true }); }
            window.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>

</html>
