<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Admin Dashboard | The Third Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* === ALL EXISTING ADMIN STYLES (unchanged) === */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #fef7e8; color: #2c2418; }
        .login-container, .dashboard-container { max-width: 1400px; margin: 30px auto; padding: 20px; }
        .login-card { background: white; border-radius: 32px; padding: 2rem; max-width: 400px; margin: 0 auto; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.15); text-align: center; }
        .login-card input { width: 100%; padding: 14px 18px; margin: 10px 0; border-radius: 60px; border: 1px solid #e2cfbc; font-size: 1rem; }
        .login-card input:focus { outline: none; border-color: #b45f2b; box-shadow: 0 0 0 3px rgba(180,95,43,0.1); }
        .login-card button { background: #5a3e2b; color: white; border: none; padding: 14px; border-radius: 60px; cursor: pointer; width: 100%; font-weight: 600; }
        .login-card button:hover { background: #b45f2b; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header-bar h1 { font-size: 1.8rem; color: #5a3e2b; }
        .back-btn { background: #7e5a3b; color: white; border: none; padding: 10px 20px; border-radius: 40px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .back-btn:hover { background: #5a3e2b; transform: translateY(-2px); }
        .logout-btn { background: #b45f2b; color: white; border: none; padding: 10px 24px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .logout-btn:hover { background: #8b4513; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; border-radius: 24px; padding: 1.5rem; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #b2703a; margin-bottom: 12px; }
        .stat-number { font-size: 2.2rem; font-weight: 800; color: #5a3e2b; margin-bottom: 8px; }
        .chart-container { background: white; border-radius: 28px; padding: 1.5rem; margin-bottom: 35px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .chart-container h3 { font-size: 1.2rem; color: #5a3e2b; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e6cfad; display: flex; align-items: center; gap: 10px; }
        canvas { max-height: 320px; }
        .orders-table-container { background: white; border-radius: 28px; padding: 1.5rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); overflow-x: auto; margin-bottom: 30px; }
        .orders-table-container h3 { font-size: 1.2rem; color: #5a3e2b; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #e6cfad; }
        .orders-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 800px; }
        .orders-table th { text-align: left; padding: 14px 12px; background: #f8efe3; color: #5a3e2b; font-weight: 600; border-bottom: 2px solid #e6cfad; }
        .orders-table td { padding: 14px 12px; border-bottom: 1px solid #f0e0ca; vertical-align: top; }
        .order-items span { display: inline-block; background: #f0e0ca; padding: 3px 8px; border-radius: 20px; margin: 2px 4px 2px 0; font-size: 0.75rem; white-space: nowrap; }
        .order-id-badge { background: #e6cfad; color: #5a3e2b; padding: 4px 10px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .order-total { font-weight: 700; color: #b45f2b; }
        .empty-orders { text-align: center; padding: 3rem; color: #7e5a3b; font-style: italic; }
        .loading { text-align: center; padding: 2rem; color: #7e5a3b; }
        .error { color: #c0392b; margin-top: 10px; }
        @media (max-width:768px) { .dashboard-container { padding: 15px; } .orders-table th, .orders-table td { padding: 10px 8px; font-size: 0.8rem; } .header-bar h1 { font-size: 1.4rem; } }
    </style>
</head>
<body>
<div id="app">
    <div class="login-container" id="loginView">
        <div class="login-card">
            <i class="fas fa-lock" style="font-size:48px; color:#5a3e2b; margin-bottom:15px;"></i>
            <h2 style="margin-bottom:20px;">Admin Login</h2>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <div class="dashboard-container" id="dashboardView" style="display: none;">
        <div class="header-bar">
            <h1><i class="fas fa-chart-line"></i> Admin Dashboard</h1>
            <div style="display:flex; gap:12px;">
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Website</a>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="stats-grid" id="summaryStats"><div class="loading">Loading stats...</div></div>

        <div class="chart-container">
            <h3><i class="fas fa-chart-bar"></i> Period Comparison (Cakes vs Drinks)</h3>
            <canvas id="periodChart"></canvas>
        </div>

        <div class="chart-container">
            <h3><i class="fas fa-chart-pie"></i> All Time Sales</h3>
            <canvas id="allTimeChart"></canvas>
        </div>

        <div class="orders-table-container">
            <h3><i class="fas fa-list"></i> All Customer Orders</h3>
            <div id="ordersTable"><div class="loading">Loading orders...</div></div>
        </div>

        <div class="orders-table-container">
            <h3><i class="fas fa-comment-dots"></i> Customer Complaints / Feedback</h3>
            <div id="complaintsTable"><div class="loading">Loading complaints...</div></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = 'https://thethirdspace-3.onrender.com';
    let authToken = null;

    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    loginBtn.onclick = async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        loginError.innerText = '';
        try {
            const res = await fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Login failed');
            authToken = data.token;
            localStorage.setItem('admin_token', authToken);
            await loadDashboard();
        } catch (err) {
            loginError.innerText = err.message;
        }
    };

    logoutBtn.onclick = () => {
        authToken = null;
        localStorage.removeItem('admin_token');
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
    };

    async function loadDashboard() {
        if (!authToken) {
            const saved = localStorage.getItem('admin_token');
            if (saved) authToken = saved;
            else return;
        }
        try {
            const statsRes = await fetch(`${API_BASE}/api/admin/stats`, { headers: { 'Authorization': `Bearer ${authToken}` } });
            if (statsRes.status === 401) throw new Error('Session expired');
            const statsData = await statsRes.json();

            const ordersRes = await fetch(`${API_BASE}/api/admin/orders`, { headers: { 'Authorization': `Bearer ${authToken}` } });
            const ordersData = await ordersRes.json();
            const allOrders = ordersData.orders || [];

            document.getElementById('summaryStats').innerHTML = `
                <div class="stat-card"><h3>Today's Orders</h3><div class="stat-number">${statsData.day.total_orders}</div><div>Cakes: ${statsData.day.cake} | Drinks: ${statsData.day.drink}</div></div>
                <div class="stat-card"><h3>This Week</h3><div class="stat-number">${statsData.week.total_orders}</div><div>Cakes: ${statsData.week.cake} | Drinks: ${statsData.week.drink}</div></div>
                <div class="stat-card"><h3>This Month</h3><div class="stat-number">${statsData.month.total_orders}</div><div>Cakes: ${statsData.month.cake} | Drinks: ${statsData.month.drink}</div></div>
                <div class="stat-card"><h3>This Year</h3><div class="stat-number">${statsData.year.total_orders}</div><div>Cakes: ${statsData.year.cake} | Drinks: ${statsData.year.drink}</div></div>
                <div class="stat-card"><h3>All Time</h3><div class="stat-number">${statsData.all_time.total_orders}</div><div>Cakes: ${statsData.all_time.cake} | Drinks: ${statsData.all_time.drink}</div></div>
            `;

            let oldPeriod = Chart.getChart('periodChart');
            if (oldPeriod) oldPeriod.destroy();
            let oldAll = Chart.getChart('allTimeChart');
            if (oldAll) oldAll.destroy();

            new Chart(document.getElementById('periodChart'), {
                type: 'bar',
                data: {
                    labels: ['Day', 'Week', 'Month', 'Year'],
                    datasets: [
                        { label: 'Cakes', data: [statsData.day.cake, statsData.week.cake, statsData.month.cake, statsData.year.cake], backgroundColor: '#d4a373', borderRadius: 8 },
                        { label: 'Drinks', data: [statsData.day.drink, statsData.week.drink, statsData.month.drink, statsData.year.drink], backgroundColor: '#b45f2b', borderRadius: 8 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            new Chart(document.getElementById('allTimeChart'), {
                type: 'pie',
                data: { labels: ['Cakes', 'Drinks'], datasets: [{ data: [statsData.all_time.cake, statsData.all_time.drink], backgroundColor: ['#d4a373', '#b45f2b'] }] }
            });

            renderOrdersTable(allOrders);
            await loadComplaints();  // <-- NEW: load complaints after orders

            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
        } catch (err) {
            console.error(err);
            authToken = null;
            localStorage.removeItem('admin_token');
            loginView.style.display = 'block';
            dashboardView.style.display = 'none';
            alert('Session expired. Please login again.');
        }
    }

    function renderOrdersTable(orders) {
        const container = document.getElementById('ordersTable');
        if (!orders.length) {
            container.innerHTML = '<div class="empty-orders"><i class="fas fa-coffee"></i> No orders found yet.</div>';
            return;
        }
        let html = `<table class="orders-table"><thead><tr><th>ID</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Date</th><th>Notes</th></tr></thead><tbody>`;
        for (const order of orders) {
            const itemsHtml = order.items.map(item => `<span>${escapeHtml(item.name)} ×${item.quantity}</span>`).join('');
            html += `<tr><td><span class="order-id-badge">#${order.order_id}</span></td><td><strong>${escapeHtml(order.customer_name)}</strong></td><td>${escapeHtml(order.phone)}</td><td class="order-items">${itemsHtml}</td><td class="order-total">$${order.total_amount.toFixed(2)}</td><td>${escapeHtml(order.created_at)}</td><td>${escapeHtml(order.notes || '—')}</td></tr>`;
        }
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // NEW: Load complaints from backend and display
    async function loadComplaints() {
        const container = document.getElementById('complaintsTable');
        if (!container) return;
        try {
            const res = await fetch(`${API_BASE}/api/admin/complaints`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (res.status === 401) throw new Error('Unauthorized');
            const data = await res.json();
            const complaints = data.complaints || [];
            if (complaints.length === 0) {
                container.innerHTML = '<div class="empty-orders"><i class="fas fa-smile"></i> No feedback received yet.</div>';
                return;
            }
            let html = `<table class="orders-table"><thead><tr><th>ID</th><th>Name</th><th>Contact</th><th>Message</th><th>Date</th></tr></thead><tbody>`;
            for (const c of complaints) {
                html += `<tr><td>${c.id}</td><td><strong>${escapeHtml(c.name)}</strong></td><td>${escapeHtml(c.contact)}</td><td style="max-width:300px; word-break:break-word;">${escapeHtml(c.message)}</td><td>${escapeHtml(c.created_at)}</td></tr>`;
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="error">Failed to load complaints.</div>';
        }
    }

    function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }

    (async () => {
        const saved = localStorage.getItem('admin_token');
        if (saved) {
            authToken = saved;
            await loadDashboard();
        }
    })();
</script>
</body>
</html>
