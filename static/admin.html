<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | The Third Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #fef7e8;
            color: #2c2418;
        }
        .login-container, .dashboard-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 32px;
            padding: 2rem;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 60px;
            border: 1px solid #e2cfbc;
        }
        .login-card button {
            background: #5a3e2b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .stat-card h3 {
            font-size: 1rem;
            color: #b2703a;
            margin-bottom: 10px;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #5a3e2b;
        }
        .chart-container {
            background: white;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        canvas {
            max-height: 300px;
        }
        .logout-btn {
            background: #b45f2b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div id="app">
    <div class="login-container" id="loginView">
        <div class="login-card">
            <i class="fas fa-lock" style="font-size: 48px; color: #5a3e2b;"></i>
            <h2>Admin Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <div class="dashboard-container" id="dashboardView" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1><i class="fas fa-chart-line"></i> Admin Dashboard</h1>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div class="stats-grid" id="summaryStats"></div>

        <div class="chart-container">
            <h3>Period Comparison (Cakes vs Drinks)</h3>
            <canvas id="periodChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>All Time Sales</h3>
            <canvas id="allTimeChart"></canvas>
        </div>
    </div>
</div>

<script>
    let authToken = null;
    let statsData = null;

    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    loginBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        loginError.innerText = '';
        try {
            const res = await fetch('https://thethirdspace-3.onrender.com/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Login failed');
            authToken = data.token;
            localStorage.setItem('admin_token', authToken);
            await loadDashboard();
        } catch (err) {
            loginError.innerText = err.message;
        }
    });

    logoutBtn.addEventListener('click', () => {
        authToken = null;
        localStorage.removeItem('admin_token');
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
    });

    async function loadDashboard() {
        if (!authToken) {
            const saved = localStorage.getItem('admin_token');
            if (saved) authToken = saved;
            else return;
        }
        try {
            const res = await fetch('https://thethirdspace-3.onrender.com/api/admin/stats', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });
            if (res.status === 401) {
                authToken = null;
                localStorage.removeItem('admin_token');
                loginView.style.display = 'block';
                dashboardView.style.display = 'none';
                return;
            }
            statsData = await res.json();
            renderDashboard();
            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
        } catch (err) {
            console.error(err);
            alert('Failed to load stats');
        }
    }

    function renderDashboard() {
        const summaryDiv = document.getElementById('summaryStats');
        summaryDiv.innerHTML = `
            <div class="stat-card"><h3>Today's Orders</h3><div class="stat-number">${statsData.day.total_orders}</div><div>Cakes: ${statsData.day.cake} | Drinks: ${statsData.day.drink}</div></div>
            <div class="stat-card"><h3>This Week</h3><div class="stat-number">${statsData.week.total_orders}</div><div>Cakes: ${statsData.week.cake} | Drinks: ${statsData.week.drink}</div></div>
            <div class="stat-card"><h3>This Month</h3><div class="stat-number">${statsData.month.total_orders}</div><div>Cakes: ${statsData.month.cake} | Drinks: ${statsData.month.drink}</div></div>
            <div class="stat-card"><h3>This Year</h3><div class="stat-number">${statsData.year.total_orders}</div><div>Cakes: ${statsData.year.cake} | Drinks: ${statsData.year.drink}</div></div>
            <div class="stat-card"><h3>All Time</h3><div class="stat-number">${statsData.all_time.total_orders}</div><div>Cakes: ${statsData.all_time.cake} | Drinks: ${statsData.all_time.drink}</div></div>
        `;

        // Period comparison chart (day, week, month, year)
        const ctxPeriod = document.getElementById('periodChart').getContext('2d');
        new Chart(ctxPeriod, {
            type: 'bar',
            data: {
                labels: ['Day', 'Week', 'Month', 'Year'],
                datasets: [
                    { label: 'Cakes', data: [statsData.day.cake, statsData.week.cake, statsData.month.cake, statsData.year.cake], backgroundColor: '#d4a373' },
                    { label: 'Drinks', data: [statsData.day.drink, statsData.week.drink, statsData.month.drink, statsData.year.drink], backgroundColor: '#b45f2b' }
                ]
            },
            options: { responsive: true, maintainAspectRatio: true }
        });

        // All time pie chart
        const ctxAll = document.getElementById('allTimeChart').getContext('2d');
        new Chart(ctxAll, {
            type: 'pie',
            data: {
                labels: ['Cakes', 'Drinks'],
                datasets: [{ data: [statsData.all_time.cake, statsData.all_time.drink], backgroundColor: ['#d4a373', '#b45f2b'] }]
            }
        });
    }

    // Auto-login if token exists
    (async () => {
        const saved = localStorage.getItem('admin_token');
        if (saved) {
            authToken = saved;
            await loadDashboard();
        }
    })();
</script>
</body>
</html>s
