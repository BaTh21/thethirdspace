<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ផ្ទាំងគ្រប់គ្រង | The Third Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Khmer OS', 'Noto Sans Khmer', system-ui, sans-serif;
            background: #fef7e8;
            color: #2c2418;
        }

        .login-container, .dashboard-container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 32px;
            padding: 2rem;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-card input {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            border-radius: 60px;
            border: 1px solid #e2cfbc;
            font-size: 1rem;
            transition: 0.2s;
        }

        .login-card input:focus {
            outline: none;
            border-color: #b45f2b;
            box-shadow: 0 0 0 3px rgba(180, 95, 43, 0.1);
        }

        .login-card button {
            background: #5a3e2b;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
        }

        .login-card button:hover {
            background: #b45f2b;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-bar h1 {
            font-size: 1.8rem;
            color: #5a3e2b;
        }

        .logout-btn {
            background: #b45f2b;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .logout-btn:hover {
            background: #8b4513;
            transform: translateY(-2px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b2703a;
            margin-bottom: 12px;
        }

        .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #5a3e2b;
            margin-bottom: 8px;
        }

        .stat-card div:last-child {
            font-size: 0.85rem;
            color: #7e5a3b;
        }

        .chart-container {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 35px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .chart-container h3 {
            font-size: 1.2rem;
            color: #5a3e2b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e6cfad;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        canvas {
            max-height: 320px;
        }

        .orders-table-container {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .orders-table-container h3 {
            font-size: 1.2rem;
            color: #5a3e2b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e6cfad;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 800px;
        }

        .orders-table th {
            text-align: left;
            padding: 14px 12px;
            background: #f8efe3;
            color: #5a3e2b;
            font-weight: 600;
            border-bottom: 2px solid #e6cfad;
        }

        .orders-table td {
            padding: 14px 12px;
            border-bottom: 1px solid #f0e0ca;
            vertical-align: top;
            color: #3a2a1a;
        }

        .orders-table tbody tr:nth-child(even) {
            background-color: #fefaf5;
        }

        .orders-table tbody tr:hover {
            background-color: #fdf5ea;
            transition: 0.2s;
        }

        .order-items {
            font-size: 0.85rem;
            line-height: 1.4;
            max-width: 280px;
        }

        .order-items span {
            display: inline-block;
            background: #f0e0ca;
            padding: 3px 8px;
            border-radius: 20px;
            margin: 2px 4px 2px 0;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .order-id-badge {
            background: #e6cfad;
            color: #5a3e2b;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .order-total {
            font-weight: 700;
            color: #b45f2b;
        }

        .order-notes {
            font-size: 0.8rem;
            color: #7e5a3b;
            max-width: 180px;
            word-break: break-word;
        }

        .empty-orders {
            text-align: center;
            padding: 3rem;
            color: #7e5a3b;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7e5a3b;
        }

        .error {
            color: #c0392b;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 15px;
            }
            .orders-table th, 
            .orders-table td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }
            .order-items span {
                font-size: 0.7rem;
                padding: 2px 6px;
            }
            .header-bar h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- ទំព័រចូលប្រើប្រាស់ (Login) -->
    <div class="login-container" id="loginView">
        <div class="login-card">
            <i class="fas fa-lock" style="font-size: 48px; color: #5a3e2b; margin-bottom: 15px;"></i>
            <h2 style="margin-bottom: 20px;">ចូលប្រើប្រាស់អ្នកគ្រប់គ្រង</h2>
            <input type="text" id="username" placeholder="ឈ្មោះអ្នកប្រើ" value="admin">
            <input type="password" id="password" placeholder="ពាក្យសម្ងាត់" value="admin123">
            <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> ចូលប្រើ</button>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <!-- ផ្ទាំងគ្រប់គ្រង (Dashboard) -->
    <div class="dashboard-container" id="dashboardView" style="display: none;">
        <div class="header-bar">
            <h1><i class="fas fa-chart-line"></i> ផ្ទាំងគ្រប់គ្រង</h1>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> ចាកចេញ</button>
        </div>

        <!-- ស្ថិតិរហ័ស -->
        <div class="stats-grid" id="summaryStats">
            <div class="loading">កំពុងផ្ទុកទិន្នន័យ...</div>
        </div>

        <!-- ក្រាហ្វប្រៀបធៀបតាមកាលកំណត់ -->
        <div class="chart-container">
            <h3><i class="fas fa-chart-bar"></i> ប្រៀបធៀបនំខេក និងភេសជ្ជៈ</h3>
            <canvas id="periodChart"></canvas>
        </div>

        <!-- ក្រាហ្វសរុបគ្រប់ពេល -->
        <div class="chart-container">
            <h3><i class="fas fa-chart-pie"></i> សរុបការលក់គ្រប់ពេល</h3>
            <canvas id="allTimeChart"></canvas>
        </div>

        <!-- តារាងបង្ហាញការបញ្ជាទិញទាំងអស់ -->
        <div class="orders-table-container">
            <h3><i class="fas fa-list"></i> បញ្ជីការបញ្ជាទិញពីអតិថិជន</h3>
            <div id="ordersTable">
                <div class="loading">កំពុងផ្ទុកការបញ្ជាទិញ...</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================
    // URL នៃ backend (Render)
    // ============================================
    const API_BASE = 'https://thethirdspace-3.onrender.com';

    let authToken = null;
    const loginView = document.getElementById('loginView');
    const dashboardView = document.getElementById('dashboardView');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');

    // ចូលប្រើ
    loginBtn.onclick = async () => {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        loginError.innerText = '';
        try {
            const res = await fetch(`${API_BASE}/api/admin/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Login failed');
            authToken = data.token;
            localStorage.setItem('admin_token', authToken);
            await loadDashboard();
        } catch (err) {
            loginError.innerText = err.message;
        }
    };

    // ចាកចេញ
    logoutBtn.onclick = () => {
        authToken = null;
        localStorage.removeItem('admin_token');
        loginView.style.display = 'block';
        dashboardView.style.display = 'none';
    };

    // ផ្ទុកទិន្នន័យទៅកាន់ផ្ទាំងគ្រប់គ្រង
    async function loadDashboard() {
        if (!authToken) {
            const saved = localStorage.getItem('admin_token');
            if (saved) authToken = saved;
            else return;
        }
        try {
            const statsRes = await fetch(`${API_BASE}/api/admin/stats`, { headers: { 'Authorization': `Bearer ${authToken}` } });
            if (statsRes.status === 401) throw new Error('Session expired');
            const statsData = await statsRes.json();

            const ordersRes = await fetch(`${API_BASE}/api/admin/orders`, { headers: { 'Authorization': `Bearer ${authToken}` } });
            const ordersData = await ordersRes.json();
            const allOrders = ordersData.orders || [];

            // បង្ហាញស្ថិតិ
            document.getElementById('summaryStats').innerHTML = `
                <div class="stat-card"><h3>ការបញ្ជាទិញថ្ងៃនេះ</h3><div class="stat-number">${statsData.day.total_orders}</div><div>នំខេក: ${statsData.day.cake} | ភេសជ្ជៈ: ${statsData.day.drink}</div></div>
                <div class="stat-card"><h3>សប្តាហ៍នេះ</h3><div class="stat-number">${statsData.week.total_orders}</div><div>នំខេក: ${statsData.week.cake} | ភេសជ្ជៈ: ${statsData.week.drink}</div></div>
                <div class="stat-card"><h3>ខែនេះ</h3><div class="stat-number">${statsData.month.total_orders}</div><div>នំខេក: ${statsData.month.cake} | ភេសជ្ជៈ: ${statsData.month.drink}</div></div>
                <div class="stat-card"><h3>ឆ្នាំនេះ</h3><div class="stat-number">${statsData.year.total_orders}</div><div>នំខេក: ${statsData.year.cake} | ភេសជ្ជៈ: ${statsData.year.drink}</div></div>
                <div class="stat-card"><h3>គ្រប់ពេល</h3><div class="stat-number">${statsData.all_time.total_orders}</div><div>នំខេក: ${statsData.all_time.cake} | ភេសជ្ជៈ: ${statsData.all_time.drink}</div></div>
            `;

            // បំផ្លាញក្រាហ្វចាស់ (បើមាន)
            let oldPeriod = Chart.getChart('periodChart');
            if (oldPeriod) oldPeriod.destroy();
            let oldAll = Chart.getChart('allTimeChart');
            if (oldAll) oldAll.destroy();

            // ក្រាហ្វប្រៀបធៀប
            new Chart(document.getElementById('periodChart'), {
                type: 'bar',
                data: {
                    labels: ['ថ្ងៃ', 'សប្តាហ៍', 'ខែ', 'ឆ្នាំ'],
                    datasets: [
                        { label: 'នំខេក', data: [statsData.day.cake, statsData.week.cake, statsData.month.cake, statsData.year.cake], backgroundColor: '#d4a373', borderRadius: 8 },
                        { label: 'ភេសជ្ជៈ', data: [statsData.day.drink, statsData.week.drink, statsData.month.drink, statsData.year.drink], backgroundColor: '#b45f2b', borderRadius: 8 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });

            // ក្រាហ្វចំណែកគ្រប់ពេល
            new Chart(document.getElementById('allTimeChart'), {
                type: 'pie',
                data: {
                    labels: ['នំខេក', 'ភេសជ្ជៈ'],
                    datasets: [{ data: [statsData.all_time.cake, statsData.all_time.drink], backgroundColor: ['#d4a373', '#b45f2b'] }]
                }
            });

            // បង្ហាញតារាងការបញ្ជាទិញ
            renderOrdersTable(allOrders);

            loginView.style.display = 'none';
            dashboardView.style.display = 'block';
        } catch (err) {
            console.error(err);
            authToken = null;
            localStorage.removeItem('admin_token');
            loginView.style.display = 'block';
            dashboardView.style.display = 'none';
            alert('វគ្គផុតកំណត់។ សូមចូលប្រើប្រាស់ម្តងទៀត។');
        }
    }

    // តារាងបង្ហាញការបញ្ជាទិញ
    function renderOrdersTable(orders) {
        const container = document.getElementById('ordersTable');
        if (!orders.length) {
            container.innerHTML = '<div class="empty-orders"><i class="fas fa-coffee"></i> មិនទាន់មានការបញ្ជាទិញនៅឡើយទេ។<br><small>ការបញ្ជាទិញនឹងបង្ហាញនៅទីនេះនៅពេលអតិថិជនដាក់បញ្ជា។</small></div>';
            return;
        }

        let tableHtml = `
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>លេខបញ្ជា</th>
                        <th>ឈ្មោះអតិថិជន</th>
                        <th>ទូរស័ព្ទ</th>
                        <th>មុខម្ហូប (ចំនួន)</th>
                        <th>សរុបទឹកប្រាក់</th>
                        <th>កាលបរិច្ឆេទ &amp; ម៉ោង</th>
                        <th>កំណត់ចំណាំ</th>
                    </tr>
                </thead>
                <tbody>
        `;

        for (const order of orders) {
            const itemsHtml = order.items.map(item => `<span>${escapeHtml(item.name)} ×${item.quantity}</span>`).join('');
            tableHtml += `
                <tr>
                    <td><span class="order-id-badge">#${order.order_id}</span></td>
                    <td><strong>${escapeHtml(order.customer_name)}</strong></td>
                    <td>${escapeHtml(order.phone)}</td>
                    <td class="order-items">${itemsHtml}</td>
                    <td class="order-total">$${order.total_amount.toFixed(2)}</td>
                    <td>${escapeHtml(order.created_at)}</td>
                    <td class="order-notes">${escapeHtml(order.notes || '—')}</td>
                </tr>
            `;
        }

        tableHtml += `</tbody></table>`;
        container.innerHTML = tableHtml;
    }

    function escapeHtml(s) {
        if (!s) return '';
        return s.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    // ចូលដោយស្វ័យប្រវត្តិប្រសិនបើមាន token រួចហើយ
    (async () => {
        const saved = localStorage.getItem('admin_token');
        if (saved) {
            authToken = saved;
            await loadDashboard();
        }
    })();
</script>
</body>
</html>
